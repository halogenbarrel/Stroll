{% extends 'base.html' %}
{% block content %}

<style>
  /* Custom card styling that builds on Bootstrap */
  .card {
    border: none;
    background: var(--miasma-river);
    transition: all 0.3s ease;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 100px;
  }

  .card-link {
    text-decoration: none;
    display: block;
    height: 100%;
  }

  .card:hover {
    transform: translateY(-5px);
    background: var(--miasma-river-alpha);
    cursor: pointer;
  }

  .card-body {
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    height: 100%;
    width: 100%;
  }

  .card-title {
    color: var(--miasma-sky);
    font-size: 1.5rem;
    margin-bottom: 0;
    text-align: center;
    width: 100%;
  }

  .card-body h2 {
    margin: 0;
    width: 100%;
    text-align: center;
  }

  /* Custom welcome text styling */
  .welcome-text {
    color: var(--miasma-marble);
    font-size: 2.5rem;
    font-weight: 600;
    margin-bottom: 2rem;
    text-align: center;
  }

  /* Add some spacing and max-width to the container */
  .settings-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem 1rem;
  }

  /* Make cards same height and center content */
  .settings-options {
    margin-top: 2rem;
  }

  /* Special styling for logout card */
  .logout-card {
    background: var(--miasma-fire);
  }

  .logout-card:hover {
    background: var(--miasma-terracota);
  }

  .logout-card .card-title {
    color: var(--miasma-marble);
  }
</style>

<div class="settings-container">
  <h1 class="welcome-text">Settings</h1>

  <div class="row row-cols-1 row-cols-md-3 g-4 settings-options">
    <div class="col">
      <a href="{% url 'userbase:edit_profile' %}" class="card-link">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title">Edit My Info</h2>
          </div>
        </div>
      </a>
    </div>

    <!-- only owners can see button to edit dogs, and they can only view their dogs in edit page-->
    {% if user.owner_profile %}
    <div class="col">
      <a href="{% url 'owner_dashboard' %}" class="card-link">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title">Edit Dog Profiles</h2>
          </div>
        </div>
      </a>
    </div>
    {% endif %}

  </div>
</div>
{% endblock %}
