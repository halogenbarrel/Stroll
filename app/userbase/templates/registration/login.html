{% extends "base.html" %}

{% block extra_css %}
<style>
    h2 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: white;
    }

    input {
        background-color: var(--miasma-obsidian);
        color: var(--miasma-marble);
    }

    label {
        color: white;
    }

    .login-container {
        background-color: var(--miasma-charcoal);
        max-width: 400px;
        margin: 2rem auto;
        padding: 2rem;
        border: 1px solid #ddd;
        border-radius: 8px;
    }

    .login-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .login-form p {
        margin: 0;
    }

    .login-form input {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ddd;
        border-radius: 4px;
    }

    .btn-primary {
        background-color: var(--miasma-eucalyptus);
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
    }
</style>
{% endblock %}

{% block content %}

<div class="login-container">
    <h2>Login to Stroll</h2>

    <form method="post" class="login-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
</div>

{% endblock %}
