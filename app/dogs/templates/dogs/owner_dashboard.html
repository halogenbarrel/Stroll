{% extends 'base.html' %}

{% block extra_css %}
<style>
    .dashboard-container {
        color: var(--miasma-marble);
    }

    .dashboard-container h2 {
        color: var(--miasma-lemon);
        margin-bottom: 1.5rem;
    }

    .dashboard-container h3 {
        color: var(--miasma-lemon);
    }

    .dashboard-container p {
        color: var(--miasma-marble);
    }

    .dog-card {
        background-color: var(--miasma-charcoal);
        border: 1px solid var(--miasma-graphite);
        padding: 1rem;
        margin-bottom: 1rem;
        border-radius: 0.25rem;
    }
</style>
{% endblock %}

{% block content %}
  <div class="dashboard-container">
    <h2>My Dogs</h2>
    {% for dog in dogs %}
      <div class="dog-card">
        <h3>{{ dog.dog_name }}</h3>
        <a href="{% url 'edit_dog' dog.id %}" class="btn btn-sm btn-outline-primary">Edit</a>
      </div>
    {% empty %}
      <p>You haven’t added any dogs yet.</p>
    {% endfor %}
  </div>
{% endblock %}
